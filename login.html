<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Liona</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">Liona</a>
    <nav><a href="index.html">Accueil</a></nav>
  </header>

  <main>
    <div class="form-card">
      <h2>Se Connecter</h2>
      <p class="subtitle">Ravi de vous revoir.</p>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="exemple@domaine.com">
          <span class="error-msg" id="emailError">Adresse email invalide.</span>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••">
          <span class="error-msg" id="passError">Au moins 6 caractères requis.</span>
        </div>
        <button type="submit" class="btn btn-full">Connexion</button>
      </form>

      <p class="form-link">
        Pas encore de compte ? <a href="registre.html">S'inscrire</a>
      </p>
    </div>
  </main>

  <footer>&copy; 2026 Liona. Tous droits réservés.</footer>

  <script src="toast.js"></script>
  <script src="login.js"></script>
</body>
</html>
