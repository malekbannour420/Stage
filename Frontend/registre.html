<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription | Liona</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">Liona</a>
    <nav><a href="index.html">Accueil</a></nav>
  </header>

  <main>
    <div class="form-card">
      <h2>S'inscrire</h2>
      <p class="subtitle">Créez votre compte pour commencer à publier.</p>
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Nom Complet</label>
          <input type="text" id="name" placeholder="Votre nom">
          <span class="error-msg" id="nameError">Le nom est obligatoire (min. 3 caractères).</span>
        </div>

        <div class="form-group">
          <label for="reg-email">Adresse Email</label>
          <input type="email" id="reg-email" placeholder="exemple@domaine.com">
          <span class="error-msg" id="emailError">Adresse email invalide.</span>
        </div>

        <div class="form-group">
          <label for="reg-pass">Mot de passe</label>
          <input type="password" id="reg-pass" placeholder="••••••••">
          <span class="error-msg" id="passError">Au moins 6 caractères requis.</span>
        </div>

        <button type="submit" class="btn btn-full">Créer mon compte</button>
      </form>

      <p class="form-link">
        Vous avez déjà un compte ? <a href="login.html">Se connecter</a>
      </p>
    </div>
  </main>

  <footer>&copy; 2026 Liona. Tous droits réservés.</footer>

  <script src="toast.js"></script>
  <script src="registre.js"></script>
</body>
</html>
